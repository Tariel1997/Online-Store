<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dancing+Script:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./../css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./../js/header-scripts.js" defer></script>
    <script src="./../js/details.js" defer></script>
</head>

<body class="gradient">

    <header>

        <nav>
            <aside class="left-header">
                <a href="./main.html">Istore</a>
            </aside>

            <ul>
                <li><a href="#" id="logout-link">Log Out</a></li>
                <li>
                    <button onclick="redirectToCart()">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </button>
                </li>
            </ul>

        </nav>

    </header>

    <main id="product-details-container" class="details-container">
    </main>

    <div id="rating-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3>Rate this Product</h3>
            <div id="modal-rating-stars" class="rating-stars">
                <i class="fa fa-star" data-value="1"></i>
                <i class="fa fa-star" data-value="2"></i>
                <i class="fa fa-star" data-value="3"></i>
                <i class="fa fa-star" data-value="4"></i>
                <i class="fa fa-star" data-value="5"></i>
            </div>
            <button id="modal-submit-rating-btn" class="btn btn-primary">OK</button>
        </div>
    </div>

</body>

</html>
