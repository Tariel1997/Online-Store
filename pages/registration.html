<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dancing+Script:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./../css/style.css">
    <script src="./../js/registration.js" defer></script>
</head>

<body>

    <form action="#" id="registration-form">
        <p>Registration</p>

        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="number" id="age" placeholder="Age" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="zip" placeholder="Zip code" required>
        <input type="text" id="phone" placeholder="Phone" required>
        <input type="text" id="avatar" placeholder="Avatar link" required>
        <select id="gender">
            <option selected disabled>Select gender</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
        </select>

        <button type="submit">Sign Up</button>

        <div id="message"></div>

    </form>

</body>

</html>
