<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istore</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dancing+Script:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./../css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./../js/header-scripts.js" defer></script>
    <script src="./../js/main.js" defer></script>
</head>

<body class="gradient">

    <header>

        <nav>
            <aside class="left-header">
                <a href="./main.html">Istore</a>
            </aside>

            <div class="search-block">

                <input type="search" placeholder="Search...">

                <button class="search-button">
                    <i class="fa fa-search"></i>
                </button>

            </div>

            <ul>
                <li><a href="">Search Filters</a></li>
                <li><a href="">Log Out</a></li>
                <li>
                    <button onclick="redirectToCart()">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </button>
                </li>
            </ul>

        </nav>

    </header>

    <div id="filter-dropdown" class="filter-container">
        <div class="filter-form">
            <form onsubmit="filterData(event)">
                <div class="form-row">
                    <div class="form-item">
                        <div class="form-group">
                            <label for="keyword">Keyword</label>
                            <input type="text" placeholder="Keyword" id="keyword" class="form-control">
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="form-group">
                            <label for="category">category</label>
                            <select id="category" class="form-select"></select>
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="form-group">
                            <label for="brand">brand</label>
                            <input type="text" placeholder="Brand" id="brand" class="form-control">
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="form-group">
                            <label for="rating">rating</label>
                            <input type="text" placeholder="Rating" id="rating" class="form-control" value="1">
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="form-group">
                            <label for="priceFrom">Price min</label>
                            <input type="text" placeholder="Price from" id="priceFrom" class="form-control">
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="form-group">
                            <label for="priceTo">Price max</label>
                            <input type="text" placeholder="Price to" id="priceTo" class="form-control" value="1">
                        </div>
                    </div>
                </div>
                <div class="button-row">
                    <button type="submit" class="btn-primary">Search</button>
                </div>
            </form>
        </div>
    </div>

    <div id="products-container">

    </div>

</body>

</html>
